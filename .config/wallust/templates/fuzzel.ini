[main]
font=Jetbrains Mono:size=20
icons=true

width=25
lines=10
horizontal-pad=10
vertical-pad=10
inner-pad=8

layer=top
exit-on-keyboard-focus-loss=true
prompt="> "

terminal=kitty -e

[colors]
background={{ background | strip }}{{ alpha | alpha_hexa }}
text={{ foreground | strip }}{{ alpha | alpha_hexa }}
prompt={{ color3 | strip }}{{ alpha | alpha_hexa }}
placeholder={{ color8 | strip }}{{ alpha | alpha_hexa }}
input={{ foreground | strip }}{{ alpha | alpha_hexa }}
match={{ color3 | strip }}{{ alpha | alpha_hexa }}
selection={{ color0 | lighten(0.25) | strip }}{{ alpha | alpha_hexa }}
selection-text={{ foreground | strip }}{{ alpha | alpha_hexa }}
selection-match={{ color3 | strip }}{{ alpha | alpha_hexa }}
border={{ foreground | strip }}{{ alpha | alpha_hexa }}

[border]
width=2
radius=8

[key-bindings]
prev=Up Control+p Control+k
next=Down Control+n Control+j
cancel=Escape Control+c
execute=Return KP_Enter

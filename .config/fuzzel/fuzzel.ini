[main]
# Font and icon settings
font=Jetbrains Mono:size=20
icons=true

# Window layout and positioning
width=25
lines=10
horizontal-pad=10
vertical-pad=10
inner-pad=8
#image-size-ratio=1

# Window behavior & layer shell (Wayland)
layer=top
exit-on-keyboard-focus-loss=true
prompt="> "

# External runner defaults
terminal=kitty -e

[colors]
# Gruvbox Dark Palette (Format: RRGGBBAA)
background=282828ff
text=ebdbb2ff
prompt=fabd2fff
placeholder=928374ff
input=ebdbb2ff
match=fabd2fff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fabd2fff
border=ebdbb2ff

[border]
width=2
radius=8

[key-bindings]
# Vi / Emacs navigation style bindings
prev=Up Control+p Control+k
next=Down Control+n Control+j
cancel=Escape Control+c
execute=Return KP_Enter

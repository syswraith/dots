force_keyboard_focus = true
theme = "gruvbox"

[providers]
default = [
    "desktopapplications",
    "files",
    "calc",
    "runner",
]

max_results = 6
ignore_preview = ["files", "desktopapplications", "calc", "websearch"]

# Set Kitty and Neovim for application launching
[providers.desktopapplications]
terminal = "kitty -e"
exec_prefix = "env EDITOR=nvim"

# Set Bash as your default runner shell
[providers.runner]
shell = "bash"

# Launch terminal applications directly in Kitty using Neovim
[providers.terminal]
app = "kitty"
